<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Course Player - V4</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Polyfill removed -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    /* --- CORE STYLES --- */
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #stage-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
    }

    /* THE VIDEO STAGE */
    #stage {
      width: 1280px;
      height: 720px;
      background: radial-gradient(circle at center, #1e3c72 0%, #2a5298 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
      perspective: 1000px;
      border: 2px solid #333;
    }

    /* --- LAYERS --- */

    /* 1. Background Image (Recap/Weatherman) */
    #bg-image-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 0;
    }

    /* 2. Scene Label (New Feature for Recap) */
    #scene-label {
      position: absolute;
      bottom: 40px;
      left: 40px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 15px 25px;
      border-left: 5px solid #fbbf24;
      border-radius: 0 10px 10px 0;
      font-size: 1.5rem;
      color: white;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 2;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    /* 3. Content Wrapper (Text) */
    #content-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      display: flex;
      align-items: center;
      padding-left: 60px;
      transition: all 0.6s ease;
    }

    #content-box {
      width: 55%;
      background: rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      transform-origin: center left;
      transition: transform 0.2s ease-out;
      max-height: 80vh;
      /* Prevent overflow */
      display: flex;
      flex-direction: column;
    }

    #slide-image-container {
      margin-bottom: 20px;
      text-align: center;
      display: none;
      /* Hidden by default */
    }

    #slide-image-container img {
      max-height: 250px;
      max-width: 100%;
      border-radius: 8px;
      border: 2px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.8rem;
      margin: 0 0 25px 0;
      color: #fbbf24;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      line-height: 1.1;
    }

    .segment-item {
      font-size: 1.5rem;
      margin-bottom: 18px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      border-left: 4px solid transparent;
      opacity: 0.4;
      transform: translateX(-10px);
      transition: all 0.4s ease;
    }

    .segment-item.active {
      opacity: 1;
      transform: translateX(0);
      border-left-color: #fbbf24;
      background: rgba(251, 191, 36, 0.15);
    }

    .segment-item.read {
      opacity: 0.7;
      transform: translateX(0);
    }

    /* Flashcards */
    .flashcard-container {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .flashcard {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 12px;
      flex: 1;
      border: 1px solid rgba(251, 191, 36, 0.3);
      text-align: center;
      opacity: 0.3;
      transform: scale(0.95);
      transition: all 0.5s ease;
    }

    .flashcard.active {
      opacity: 1;
      transform: scale(1.05);
      background: rgba(251, 191, 36, 0.15);
      border-color: #fbbf24;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
    }

    .flashcard.read {
      opacity: 0.8;
      transform: scale(1);
    }

    .fc-letter {
      font-size: 2.5rem;
      color: #fbbf24;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .fc-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #fff;
    }

    .fc-desc {
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.3;
    }

    /* 4. Avatar Layer */
    #avatar-canvas {
      position: absolute;
      bottom: 0;
      z-index: 20;
      pointer-events: none;
      transition: left 0.8s ease-in-out, height 0.8s ease;
      filter: drop-shadow(-20px 5px 25px rgba(0, 0, 0, 0.6));
      transform-origin: bottom center;
    }

    /* --- DYNAMIC MODES --- */
    /* Center (Intro) */
    .mode-center #avatar-canvas {
      left: 50%;
      height: 95%;
      transform: translateX(-50%);
    }

    .mode-center #content-wrapper {
      opacity: 1;
      /* Show content in intro */
      transform: translateY(0);
      z-index: 25;
      /* Bring text above avatar for intro */
      display: flex;
      justify-content: center;
      /* Center the text box */
      padding-left: 0;
      text-align: center;
    }

    .mode-center #content-box {
      width: auto;
      max-width: 80%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      align-items: center;
    }

    .mode-center #scene-label {
      opacity: 0;
    }

    /* Side (Content) */
    .mode-side #avatar-canvas {
      left: auto;
      right: 0px;
      height: 85%;
      transform: translateX(0);
    }

    .mode-side #content-wrapper {
      opacity: 1;
      transform: translateY(0);
    }

    .mode-side #scene-label {
      opacity: 0;
    }

    /* Image (Recap/Weatherman) */
    .mode-image #avatar-canvas {
      left: auto;
      right: 0px;
      height: 80%;
      transform: translateX(0);
    }

    .mode-image #content-wrapper {
      opacity: 0;
    }

    .mode-image #bg-image-layer {
      opacity: 1;
    }

    .mode-image #scene-label {
      opacity: 1;
    }

    /* --- UI CONTROLS --- */
    #controls-bar {
      height: 60px;
      background: #111;
      border-top: 1px solid #333;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
      z-index: 100;
    }

    button {
      background: #333;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #555;
    }

    .progress-container {
      flex: 1;
      height: 6px;
      background: #444;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-filled {
      height: 100%;
      background: #e50914;
      width: 0%;
      transition: width 0.1s linear;
    }

    /* Slide List */
    .slide-list-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 400px;
      scrollbar-width: thin;
      scrollbar-color: #555 #222;
    }

    .slide-thumb {
      min-width: 60px;
      padding: 5px 10px;
      background: #222;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .slide-thumb:hover {
      background: #333;
    }

    .slide-thumb.active {
      border-color: #e50914;
      background: #333;
    }

    .slide-thumb .num {
      color: #e50914;
      font-weight: bold;
    }

    .slide-thumb .type {
      color: #888;
      text-transform: uppercase;
      font-size: 9px;
    }

    /* Dev Panel (hidden by default in production) */
    #dev-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 280px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #444;
      font-size: 13px;
      z-index: 2000;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #dev-panel.show {
      display: flex;
    }

    .dev-header {
      color: #fbbf24;
      font-weight: bold;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type=range] {
      flex: 1;
      margin-right: 10px;
    }

    /* Keyboard hint */
    .keyboard-hint {
      font-size: 11px;
      color: #666;
      margin-left: auto;
    }

    /* Flashcards */
    .flashcard-container {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .flashcard {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 12px;
      flex: 1;
      border: 1px solid rgba(251, 191, 36, 0.3);
      text-align: center;
    }

    .fc-letter {
      font-size: 2.5rem;
      color: #fbbf24;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .fc-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #fff;
    }

    .fc-desc {
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.3;
    }

    /* KHAN STYLE / WEATHERMAN MODE */
    .khan-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      /* Below content (5) and avatar (20) */
      transition: opacity 0.5s ease;
    }

    .mode-khan #content-wrapper {
      opacity: 0 !important;
      /* Hide text */
      pointer-events: none;
    }

    .mode-khan #scene-video {
      opacity: 1 !important;
    }

    /* Ensure Avatar is visible in Weatherman mode */
    .mode-khan #avatar-canvas {
      /* Position handled by JS, but ensure z-index is high */
      z-index: 50;
    }
  </style>
</head>

<body>

  <div id="stage-container">
    <div id="stage" class="mode-center">
      <video id="scene-video" class="khan-video" loop muted playsinline style="opacity:0"></video>
      <img id="bg-image-layer" src="">

      <div id="scene-label">Scene Title</div>

      <div id="content-wrapper">
        <div id="content-box">
          <h1 id="slide-title">Loading...</h1>
          <div id="slide-image-container"></div>
          <div id="segments-list"></div>
        </div>
      </div>

      <canvas id="avatar-canvas"></canvas>

      <video id="raw-avatar-video" loop muted playsinline style="display:none"></video>
      <audio id="main-audio"></audio>
    </div>
  </div>

  <div id="controls-bar">
    <button id="btn-play">▶ Play</button>
    <button id="btn-prev">⏮</button>
    <button id="btn-next">⏭</button>
    <span id="time-display">0:00</span>
    <div class="progress-container" id="progress-container">
      <div class="progress-filled" id="timeline-fill"></div>
    </div>
    <div class="slide-list-container" id="slide-list"></div>
    <button id="btn-dev" title="Toggle Dev Panel">⚙</button>
    <span class="keyboard-hint">Space: Play | ←→: Navigate | D: Dev Panel</span>
    <button id="btn-fullscreen" title="Full Video Mode">⛶</button>
  </div>

  <div id="dev-panel">
    <div class="dev-header">DIRECTOR CONTROLS</div>

    <label>Avatar Size</label>
    <div class="slider-row"><input type="range" id="av-scale" min="0.5" max="1.8" step="0.05" value="1.0"
        oninput="updateVisuals()"></div>

    <label>Avatar Offset (Left/Right)</label>
    <div class="slider-row"><input type="range" id="av-x" min="-200" max="200" step="10" value="0"
        oninput="updateVisuals()"></div>

    <label>Content Size</label>
    <div class="slider-row"><input type="range" id="con-scale" min="0.5" max="1.5" step="0.05" value="1.0"
        oninput="updateVisuals()"></div>

    <label>Green Screen Cutoff</label>
    <div class="slider-row"><input type="range" id="av-green" min="0" max="200" step="1" value="60"></div>
  </div>

  <script>
    // Lesson data injected by pipeline
    let lessonData = null;
    const AVATAR_URL = "assets/avatar.mp4";
    const BASE_PATH = "";

    let currentSlideIndex = 0;
    let isPlaying = false;

    const stage = document.getElementById('stage');
    const contentBox = document.getElementById('content-box');
    const avatarCanvas = document.getElementById('avatar-canvas');
    const video = document.getElementById('raw-avatar-video');
    const audio = document.getElementById('main-audio');
    const ctx = avatarCanvas.getContext('2d', { willReadFrequently: true });

    // Initialize avatar video
    // STATE
    // let lessonData = null; // Already defined above
    // let AVATAR_URL = "assets/avatar.mp4"; // Already defined above

    let currentMedia = audio; // Default to audio-driven

    if (AVATAR_URL) {
      video.src = AVATAR_URL;
      video.load();
    }

    // --- 1. VISUAL UPDATE ---
    function updateVisuals() {
      const aScale = document.getElementById('av-scale').value;
      const aX = document.getElementById('av-x').value;
      const cScale = document.getElementById('con-scale').value;

      avatarCanvas.style.transform = `translateX(${aX}px) scale(${aScale})`;
      contentBox.style.transform = `scale(${cScale})`;
    }

    // --- 2. RENDER LOOP (Chroma Key) ---
    function renderAvatar() {
      // Draw if playing OR if we have data (for static paused state)
      if ((!video.paused && !video.ended) || video.readyState >= 2) {
        if (canvasSizeMismatch()) syncCanvasSize();

        ctx.drawImage(video, 0, 0, avatarCanvas.width, avatarCanvas.height);
        const frame = ctx.getImageData(0, 0, avatarCanvas.width, avatarCanvas.height);
        const data = frame.data;
        const thresh = parseInt(document.getElementById('av-green').value);

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          if (g > thresh && g > r * 1.3 && g > b * 1.3) data[i + 3] = 0;
        }
        ctx.putImageData(frame, 0, 0);
      }
      requestAnimationFrame(renderAvatar);
    }

    function canvasSizeMismatch() { return avatarCanvas.width !== video.videoWidth; }
    function syncCanvasSize() { avatarCanvas.width = video.videoWidth; avatarCanvas.height = video.videoHeight; }
    video.addEventListener('play', renderAvatar);
    video.addEventListener('loadeddata', renderAvatar);

    // --- 3. SLIDE LOADING ---

    function loadSlide(index) {
      if (!lessonData || index >= lessonData.slides.length || index < 0) return;

      // Pause current media
      video.pause();
      audio.pause();

      currentSlideIndex = index;
      const slide = lessonData.slides[index];




      // Update slide list active state
      document.querySelectorAll('.slide-thumb').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      // Content
      const slideTitle = slide.title || 'Untitled';
      if (document.getElementById('slide-title')) document.getElementById('slide-title').innerText = slideTitle;

      const list = document.getElementById('segments-list');
      list.innerHTML = '';

      // Content Image
      const imgContainer = document.getElementById('slide-image-container');
      const bgImg = document.getElementById('bg-image-layer');
      const sceneLabel = document.getElementById('scene-label');

      // Handle Flashcards
      if (slide.visual_content && slide.visual_content.flashcards) {
        const container = document.createElement('div');
        container.className = 'flashcard-container';
        slide.visual_content.flashcards.forEach((fc, i) => {
          const card = document.createElement('div');
          card.className = 'flashcard';
          card.id = `seg-${i}`;
          card.innerHTML = `<div class="fc-letter">${fc.letter}</div><div class="fc-title">${fc.title}</div><div class="fc-desc">${fc.description}</div>`;
          container.appendChild(card);
        });
        list.appendChild(container);
        document.getElementById('content-box').style.width = '70%';

        if (slide.audio_duration && !slide.timed_segments) {
          const durationPerItem = slide.audio_duration / slide.visual_content.flashcards.length;
          slide.timed_segments = slide.visual_content.flashcards.map((_, i) => ({
            start_time: i * durationPerItem,
            end_time: (i + 1) * durationPerItem
          }));
        }
      } else {
        document.getElementById('content-box').style.width = '55%';

        let items = slide.timed_segments ||
          (slide.visual_content ? slide.visual_content.bullet_points : null) ||
          (slide.segments ? slide.segments.map(s => ({ visual: s.visual, start_time: 0, end_time: 999 })) : []);

        if (Array.isArray(items)) {
          items.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'segment-item';
            div.id = `seg-${i}`;
            div.innerHTML = typeof item === 'string' ? item : (item.visual || item.text || '');
            list.appendChild(div);
          });

          if (!slide.timed_segments && items.length > 0 && slide.audio_duration) {
            const durationPerItem = slide.audio_duration / items.length;
            slide.timed_segments = items.map((item, i) => ({
              visual: typeof item === 'string' ? item : (item.visual || item.text || ''),
              start_time: i * durationPerItem,
              end_time: (i + 1) * durationPerItem
            }));
          }
        }
      }

      if (window.MathJax) MathJax.typesetPromise();

      // MEDIA SOURCE LOGIC (Modified for HeyGen)
      let isHeyGen = slide.use_heygen_audio || slide.video_path;

      if (isHeyGen) {
        // MODE: HEYGEN VIDEO
        currentMedia = video;
        let vidSrc = slide.avatar_video_url || slide.video_path;

        if (video.src.indexOf(vidSrc) === -1) {
          video.src = vidSrc;
        }
        video.muted = false;
        video.loop = false;
        audio.src = '';
      } else {
        // MODE: STANDARD
        let audSrc = slide.audio_path || '';
        if (audSrc && !audSrc.startsWith('http') && !audSrc.startsWith('/')) {
          audSrc = audSrc.replace(/^output\/v[34]-?[^/]*\//, '');
        }

        currentMedia = audio;

        if (video.src.indexOf(AVATAR_URL) === -1) {
          video.src = AVATAR_URL;
        }
        video.muted = true;
        video.loop = true;

        audio.src = audSrc;
      }

      if (currentMedia.readyState === 0) currentMedia.load();

      if (currentMedia !== video) {
        if (video.paused) video.play().catch(e => console.log("Auto-play loop failed", e));
      }

      if (isPlaying) {
        currentMedia.play();
        if (currentMedia === audio && video.paused) video.play();
      }

      // LAYOUT MODES
      bgImg.src = '';
      bgImg.style.opacity = 0;
      if (sceneLabel) {
        sceneLabel.innerText = '';
        sceneLabel.style.opacity = 0;
      }

      if (slide.slide_type === 'intro') {
        stage.className = 'mode-center';
      } else if (slide.slide_type === 'recap') {
        stage.className = 'mode-image';
        if (slide.storyboard_scenes && slide.storyboard_scenes.length > 0) {
          bgImg.src = slide.storyboard_scenes[0].image_url;
          bgImg.style.opacity = 1;
          if (sceneLabel) {
            sceneLabel.innerText = slide.storyboard_scenes[0].concept_title || 'Scene';
            sceneLabel.style.opacity = 1;
          }
        }
      } else {
        stage.className = 'mode-side';
        if (slide.image_id) {
          if (imgContainer) {
            imgContainer.style.display = 'block';
            imgContainer.innerHTML = `<img src="images/${slide.image_id}">`;
          }
          bgImg.src = "images/" + slide.image_id;
          bgImg.style.opacity = 0.2;
        } else {
          if (imgContainer) imgContainer.style.display = 'none';
          bgImg.src = '';
          bgImg.style.opacity = 0;
        }
      }

      updateVisuals();

      // KHAN: Video Background Logic (Applied LAST to override layout modes)
      const bgVideo = document.getElementById('scene-video');
      const bgVidPath = slide.background_video;

      if (bgVidPath) {
        stage.classList.add('mode-khan');

        if (bgVideo.src.indexOf(bgVidPath) === -1) {
          bgVideo.src = bgVidPath;
          bgVideo.load();
        }
        bgVideo.play().catch(e => console.log("BG Video Play Fail", e));
      } else {
        stage.classList.remove('mode-khan');
        bgVideo.pause();
        bgVideo.style.opacity = 0;
      }

      renderAvatar();
    }


    // --- 4. TIMING & SYNC ---
    // --- 4. TIMING & SYNC ---
    function handleTimeUpdate(e) {
      // Only respond to the active driver
      if (e.target !== currentMedia) return;

      const t = currentMedia.currentTime;
      const duration = currentMedia.duration;
      const slide = lessonData.slides[currentSlideIndex];

      // Update progress bar
      if (duration && !isNaN(duration)) {
        document.getElementById('timeline-fill').style.width = (t / duration * 100) + '%';
      }
      document.getElementById('time-display').innerText = formatTime(t);

      // KHAN Sync
      const bgVideo = document.getElementById('scene-video');
      if (stage.classList.contains('mode-khan') && bgVideo) {
        if (isPlaying && bgVideo.paused) bgVideo.play();
        if (!isPlaying && !bgVideo.paused) bgVideo.pause();

        // Optional: Sync time? content is usually shorter than video or different.
        // Manim videos are usually EXACT length of audio if generated properly, but here we stitched partials.
        // So let's try to sync time if possible, or just loop/play.
        // User said: "display the each of the videos in background basedon the exact narration timineg"
        // So we SHOULD sync time.

        if (Math.abs(bgVideo.currentTime - t) > 0.5) {
          bgVideo.currentTime = t;
        }
      }


      // A. Sync Bullets/Segments
      if (slide.timed_segments) {
        slide.timed_segments.forEach((seg, i) => {
          const el = document.getElementById(`seg-${i}`);
          if (!el) return;

          // Handle Flashcards (seg-i) vs Segments (.segment-item)
          // If it's a flashcard (has .flashcard class)
          const isFlashcard = el.classList.contains('flashcard');

          if (t >= seg.start_time && t < seg.end_time) {
            el.classList.add('active');
            el.classList.remove('read');
          } else if (t >= seg.end_time) {
            el.classList.remove('active');
            el.classList.add('read');
          } else {
            el.classList.remove('active');
            el.classList.remove('read');
          }
        });
      }
      // B. Sync Recap Scenes
      if (slide.storyboard_scenes) {
        slide.storyboard_scenes.forEach((scene) => {
          if (t >= scene.start_time && t < scene.end_time) {
            const bg = document.getElementById('bg-image-layer');
            const label = document.getElementById('scene-label');

            if (!bg.src.includes(scene.image_url)) {
              bg.src = scene.image_url;
              bg.style.opacity = 1;
              label.innerText = scene.concept_title || 'Scene';
            }
          }
        });
      }
    }

    audio.addEventListener('timeupdate', handleTimeUpdate);
    video.addEventListener('timeupdate', handleTimeUpdate);

    // Listen for 'ended' on whichever is current logic?
    // Actually, just listen on both, but check if target is currentMedia
    function handleEnded(e) {
      if (e.target !== currentMedia) return;
      if (currentSlideIndex < lessonData.slides.length - 1) {
        setTimeout(() => loadSlide(currentSlideIndex + 1), 1000);
      }
    }
    audio.addEventListener('ended', handleEnded);
    video.addEventListener('ended', handleEnded);

    // --- 5. HELPERS ---
    function formatTime(s) {
      return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
    }

    function togglePlay() {
      if (currentMedia.paused) {
        currentMedia.play();
        // If it's AUDIO mode, we also need to play the video loop
        if (currentMedia === audio) video.play();

        isPlaying = true;
        document.getElementById('btn-play').innerText = "⏸";
      } else {
        currentMedia.pause();
        // If it's AUDIO mode, we also need to pause the video loop
        if (currentMedia === audio) video.pause();

        isPlaying = false;
        document.getElementById('btn-play').innerText = "▶";
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) loadSlide(currentSlideIndex - 1);
    }

    function nextSlide() {
      if (currentSlideIndex < lessonData.slides.length - 1) loadSlide(currentSlideIndex + 1);
    }

    // Event Listeners
    document.getElementById('btn-play').onclick = togglePlay;
    document.getElementById('btn-prev').onclick = prevSlide;
    document.getElementById('btn-next').onclick = nextSlide;
    document.getElementById('btn-dev').onclick = () => {
      document.getElementById('dev-panel').classList.toggle('show');
    };
    document.getElementById('btn-fullscreen').onclick = toggleFullScreen;

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(err => {
          alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // Progress bar seeking
    document.getElementById('progress-container').onclick = (e) => {
      const rect = e.target.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if (audio.duration && !isNaN(audio.duration)) {
        audio.currentTime = pct * audio.duration;
      }
    };

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'ArrowLeft') prevSlide();
      if (e.code === 'ArrowRight') nextSlide();
      if (e.code === 'KeyD') document.getElementById('dev-panel').classList.toggle('show');
    });

    // Build slide list
    function buildSlideList() {
      const container = document.getElementById('slide-list');
      container.innerHTML = '';
      lessonData.slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'slide-thumb' + (i === 0 ? ' active' : '');
        div.innerHTML = `<div class="num">${i + 1}</div><div class="type">${slide.slide_type || 'content'}</div>`;
        div.onclick = () => loadSlide(i);
        container.appendChild(div);
      });
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      buildSlideList();
      loadSlide(0);
      updateVisuals();
    });
  </script>

              "narration_fragment": "Fragmentation is the process of breaking up an animal's body into two or more pieces. Each of these pieces then grows into a complete new individual.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_008_seg_0.mp3"
            },
            {
              "visual": "Example: Flatworms like Planaria and Microstomum.",
              "narration_fragment": "This method is common in organisms with simple body plans, such as flatworms. As you can see in the diagram, if a Planaria is cut, each fragment can develop into a new worm.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_008_seg_1.mp3"
            },
            {
              "visual": "Regeneration: Repairing or regrowing missing parts.",
              "narration_fragment": "Regeneration is closely related. It is a mode of asexual reproduction where the missing parts of an organism are repaired or regrown by the proliferation of cells.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_008_seg_2.mp3"
            },
            {
              "visual": "While all organisms can regenerate to some extent, for some it's a mode of reproduction.",
              "narration_fragment": "For example, if a lizard loses its tail, it can regenerate it. But for organisms like Planaria, regeneration of a fragment leads to a whole new individual, making it a form of reproduction.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_008_seg_3.mp3"
            }
          ],

        {
          "slide_number": 9,
          "slide_type": "content",
          "title": "Method 6: Spore Formation",
          "image_id": "a4c38758d2beb7324d786510e83609ec_img.jpg",
          "segments": [
            {
              "visual": "Zoospores: Motile spores with flagella. (e.g., Chlamydomonas)",
              "narration_fragment": "Zoospores are tiny, motile spores, meaning they can move using one or two flagella. They are produced inside a sac-like structure called a zoosporangium, as seen in algae like Chlamydomonas.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_009_seg_0.mp3"
            },
            {
              "visual": "Conidia: Non-motile spores formed externally. (e.g., Penicillium)",
              "narration_fragment": "Conidia are non-motile spores that are cut off externally, either singly or in chains, from the tip of a special stalk called a conidiophore. This is how fungi like Penicillium reproduce.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_009_seg_1.mp3"
            },
            {
              "visual": "Gemmules: Internal buds for surviving harsh conditions. (e.g., Sponges)",
              "narration_fragment": "Gemmules are internal asexual reproductive units, essentially internal buds. Seen here in sponges, they are tough structures that help the organism survive unfavorable conditions and germinate when things get better.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_009_seg_2.mp3"
            }

        {
          "slide_number": 10,
          "slide_type": "content",
          "title": "Method 7: Vegetative Propagation in Plants",
          "image_id": null,
          "segments": [
            {
              "visual": "Propagation by a part of the body other than a seed.",
              "narration_fragment": "Vegetative propagation is a type of asexual reproduction in plants. Here, new plants are grown from a part of the parent plant, like a root, stem, or leaf, instead of a seed.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_010_seg_0.mp3"
            },
            {
              "visual": "Natural Method - By Roots: Sweet potato, Dahlia, Guava.",
              "narration_fragment": "Nature has its own ways. Some plants use their roots for propagation. For example, the tuberous roots of sweet potato and dahlia can grow into new plants when planted.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_010_seg_1.mp3"
            },
            {
              "visual": "Natural Method - By Underground Stems:",
              "narration_fragment": "Many plants use underground modified stems. These come in various forms and are packed with stored food to support new growth.",
              "duration_estimate": 8,
              "audio_file": "audio/slide_010_seg_2.mp3"
            },
            {
              "visual": "\u2022 Rhizomes (Ginger, Turmeric) \u2022 Tubers (Potato) \u2022 Bulbs (Onion, Garlic)",
              "narration_fragment": "Examples include rhizomes, like in ginger and turmeric; tubers, such as the common potato; and bulbs, which you can see in onions and garlic.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_010_seg_3.mp3"
            }
          ],
          "segment_audio_files": [

        {
          "slide_number": 11,
          "slide_type": "content",
          "title": "Vegetative Propagation (Continued)",
          "image_id": null,
          "segments": [
            {
              "visual": "Natural Method - By Creepers:",
              "narration_fragment": "Creeping stems that grow along the ground can also give rise to new plants. They develop roots at their nodes, which then form new shoots.",
              "duration_estimate": 9,
              "audio_file": "audio/slide_011_seg_0.mp3"
            },
            {
              "visual": "\u2022 Runners (Grass) \u2022 Stolons (Strawberry) \u2022 Offsets (Water Hyacinth)",
              "narration_fragment": "Examples include runners in lawn grass, stolons in strawberry plants, and offsets in aquatic plants like the water hyacinth, or 'Jal Kumbhi'.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_011_seg_1.mp3"
            },
            {
              "visual": "Natural Method - By Leaves: e.g., Bryophyllum.",
              "narration_fragment": "Amazingly, some plants can reproduce from their leaves! Adventitious buds develop on the leaf margins of plants like Bryophyllum. When the leaf falls on moist soil, these buds grow into new plantlets.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_011_seg_2.mp3"
            },
            {
              "visual": "Special Structures: Bulbils (Agave) & Turions (Utricularia).",
              "narration_fragment": "Some plants form special fleshy buds called bulbils in the axil of leaves, like in Agave. Aquatic plants like Utricularia form overwintering buds called turions.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_011_seg_3.mp3"
            }

        {
          "slide_number": 12,
          "slide_type": "content",
          "title": "Artificial Vegetative Propagation",
          "image_id": null,
          "segments": [
            {
              "visual": "Man-made methods used by gardeners and horticulturists.",
              "narration_fragment": "Humans have developed their own methods of vegetative propagation, mainly for agriculture and gardening. These are called artificial propagation techniques.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_012_seg_0.mp3"
            },
            {
              "visual": "Cutting: A piece of root, stem, or leaf is planted. (e.g., Rose, Sugarcane)",
              "narration_fragment": "Cutting is a very common method. A piece of the parent plant's stem or root is cut and planted in the soil, where it develops roots and grows into a new plant. This is done for roses and sugarcane.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_012_seg_1.mp3"
            },
            {
              "visual": "Grafting: Joining parts of two plants to grow as one.",
              "narration_fragment": "Grafting is a more advanced technique. Here, parts of two different plants are joined together so that they continue their growth as a single plant.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_012_seg_2.mp3"
            },
            {
              "visual": "\u2022 Stock: The rooted support plant. \u2022 Scion: The twig with desired traits.",
              "narration_fragment": "The rooted portion is called the stock, often chosen for its hardiness. The part being attached, called the scion, is chosen for its desirable fruits or flowers, like in grafted mangoes and apples.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_012_seg_3.mp3"
            }
          ],
          "segment_audio_files": [

          ],

        {
          "slide_number": 13,
          "slide_type": "content",
          "title": "Merits of Vegetative Propagation",
          "image_id": null,
          "segments": [
            {
              "visual": "Fastest method of reproduction.",
              "narration_fragment": "One of the biggest advantages is speed. A potato crop can be harvested in 3-4 months using tubers, while it would take over a year using seeds.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_013_seg_0.mp3"
            },
            {
              "visual": "Enables propagation of seedless plants.",
              "narration_fragment": "It's essential for multiplying seedless plants. Think about how we get more bananas, seedless oranges, or pineapples \u2013 it\u2019s all through vegetative propagation.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_013_seg_1.mp3"
            },
            {
              "visual": "Preserves desirable qualities (genetic similarity).",
              "narration_fragment": "Since the offspring is a clone, it preserves the good qualities of the parent. A sweet mango variety can be multiplied indefinitely without any change in taste using grafting.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_013_seg_2.mp3"
            },
            {
              "visual": "Higher certainty of success than growing from seeds.",
              "narration_fragment": "This method gives 100% genetic similarity to the parent. It also bypasses problems like poor seed viability or long seed dormancy, ensuring the plant grows.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_013_seg_3.mp3"
            }
          ],
          "segment_audio_files": [
            "audio/slide_013_seg_0.mp3",

        {
          "slide_number": 14,
          "slide_type": "content",
          "title": "Demerits of Vegetative Propagation",
          "image_id": null,
          "segments": [
            {
              "visual": "No genetic variation.",
              "narration_fragment": "The biggest disadvantage is the lack of genetic variation. All offspring are identical, which reduces the population's ability to adapt to new diseases or changing environments.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_014_seg_0.mp3"
            },
            {
              "visual": "Diseases from the parent are passed to offspring.",
              "narration_fragment": "If the parent plant has a viral or bacterial disease, it will be transmitted to all the clones. This can wipe out an entire crop.",
              "duration_estimate": 9,
              "audio_file": "audio/slide_014_seg_1.mp3"
            },
            {
              "visual": "Overcrowding and competition.",
              "narration_fragment": "There is no mechanism for dispersal, unlike seeds which can travel far. This leads to overcrowding around the parent plant, causing competition for sunlight, water, and nutrients.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_014_seg_2.mp3"
            },
            {
              "visual": "Propagules are difficult to store.",
              "narration_fragment": "Vegetative parts like tubers or stems cannot be stored for as long as seeds. They are bulky and can easily rot or get infected.",
              "duration_estimate": 9,
              "audio_file": "audio/slide_014_seg_3.mp3"
            }
          ],

        {
          "slide_number": 15,
          "slide_type": "content",
          "title": "Introduction to Sexual Reproduction",
          "image_id": null,
          "segments": [
            {
              "visual": "Involves formation and fusion of male & female gametes.",
              "narration_fragment": "Sexual reproduction is a more complex process. It involves the formation of male and female gametes, which then fuse to form a zygote that develops into a new organism.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_015_seg_0.mp3"
            },
            {
              "visual": "Offspring are not identical to parents (genetic variation).",
              "narration_fragment": "Because of the fusion of gametes from two different parents, the offspring are genetically different from the parents and from each other. This is the source of variation in a population.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_015_seg_1.mp3"
            },
            {
              "visual": "Juvenile Phase: Period of growth before sexual maturity.",
              "narration_fragment": "All organisms must go through a period of growth, called the juvenile phase, before they become capable of sexual reproduction. In plants, this is called the vegetative phase.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_015_seg_2.mp3"
            },
            {
              "visual": "Reproductive Cycles in Animals:",
              "narration_fragment": "In animals, reproductive maturity is marked by cycles. Let's look at the two main types.",
              "duration_estimate": 6,
              "audio_file": "audio/slide_015_seg_3.mp3"
            },
            {
              "visual": "\u2022 Oestrus Cycle (Cow, Dog, Tiger) \u2022 Menstrual Cycle (Monkeys, Humans)",
              "narration_fragment": "Non-primate mammals like cows and dogs have an oestrus cycle, while primates like monkeys and humans have a menstrual cycle.",
              "duration_estimate": 9,
              "audio_file": "audio/slide_015_seg_4.mp3"
            }
          ],
          "segment_audio_files": [
            "audio/slide_015_seg_0.mp3",

          "audio_duration": 55.152,
          "timed_segments": [
            {
              "visual": "Involves formation and fusion of male & female gametes.",
              "narration_fragment": "Sexual reproduction is a more complex process. It involves the formation of male and female gametes, which then fuse to form a zygote that develops into a new organism.",
              "start_time": 0,
              "end_time": 12.64,
              "duration": 12.64
            },
            {
              "visual": "Offspring are not identical to parents (genetic variation).",
              "narration_fragment": "Because of the fusion of gametes from two different parents, the offspring are genetically different from the parents and from each other. This is the source of variation in a population.",
              "start_time": 12.64,
              "end_time": 25.28,
              "duration": 12.64
            },
            {
              "visual": "Juvenile Phase: Period of growth before sexual maturity.",
              "narration_fragment": "All organisms must go through a period of growth, called the juvenile phase, before they become capable of sexual reproduction. In plants, this is called the vegetative phase.",
              "start_time": 25.28,
              "end_time": 37.92,
              "duration": 12.64
            },
            {
              "visual": "Reproductive Cycles in Animals:",
              "narration_fragment": "In animals, reproductive maturity is marked by cycles. Let's look at the two main types.",
              "start_time": 37.92,
              "end_time": 44.81,

            },
            {
              "visual": "\u2022 Oestrus Cycle (Cow, Dog, Tiger) \u2022 Menstrual Cycle (Monkeys, Humans)",
              "narration_fragment": "Non-primate mammals like cows and dogs have an oestrus cycle, while primates like monkeys and humans have a menstrual cycle.",
              "start_time": 44.81,

        {

          "image_id": "4b9457ad2400572dbf0c0c9f7c825643_img.jpg",
          "segments": [
            {
              "visual": "Gametogenesis: The process of forming gametes (male & female).",
              "narration_fragment": "Gametogenesis is the first major event. It refers to the process of formation of the two types of gametes \u2013 male and female. These gametes are haploid cells.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_016_seg_0.mp3"
            },
            {
              "visual": "Homogametes (Isogametes): Gametes are similar in appearance.",
              "narration_fragment": "In some organisms, like certain algae shown here, the two gametes are so similar in appearance that you cannot distinguish them as male or female. These are called homogametes or isogametes.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_016_seg_1.mp3"
            },
            {
              "visual": "Heterogametes: Gametes are morphologically distinct.",
              "narration_fragment": "However, in the majority of sexually reproducing organisms, the gametes produced are of two distinct types. These are called heterogametes.",
              "duration_estimate": 9,
              "audio_file": "audio/slide_016_seg_2.mp3"
            },
            {
              "visual": "\u2022 Male Gamete: antherozoid or sperm. \u2022 Female Gamete: egg or ovum.",
              "narration_fragment": "In such cases, the male gamete is typically smaller and motile, called the sperm. The female gamete is larger and non-motile, known as the egg or ovum.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_016_seg_3.mp3"

        {

          "image_id": "bb08c83fc8939517c6803d65c69dd06b_img.jpg",
          "segments": [
            {
              "visual": "Bisexual / Monoecious: Both male & female parts on the same individual.",
              "narration_fragment": "Some organisms are bisexual, meaning they have both male and female reproductive structures in the same individual. In plants, the term for this is monoecious. Examples include coconut and cucurbits.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_017_seg_0.mp3"
            },
            {
              "visual": "Unisexual / Dioecious: Male & female parts on different individuals.",
              "narration_fragment": "Other organisms are unisexual, with male and female reproductive organs on separate individuals. In plants, like the one shown, this is called dioecious. Papaya and date palm are common examples.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_017_seg_1.mp3"
            },
            {
              "visual": "Hermaphrodites: Bisexual animals (e.g., Earthworm, Leech).",
              "narration_fragment": "In the animal kingdom, bisexual animals like the earthworm, sponge, and leech, which possess both male and female organs, are called hermaphrodites.",

            },

        {
          "slide_number": 18,
          "slide_type": "content",
          "title": "Cell Division in Gamete Formation",
          "image_id": null,
          "segments": [
            {
              "visual": "Haploid (n) Parent \u2192 Mitosis \u2192 Haploid (n) Gametes",
              "narration_fragment": "If the parent organism's body is haploid, with one set of chromosomes, it produces haploid gametes through mitotic division. This is seen in Monera, fungi, and bryophytes.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_018_seg_0.mp3"
            },
            {
              "visual": "Diploid (2n) Parent \u2192 Meiosis \u2192 Haploid (n) Gametes",
              "narration_fragment": "If the parent's body is diploid, with two sets of chromosomes, it must undergo meiosis, or reduction division, to produce haploid gametes. This is crucial to maintain chromosome number.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_018_seg_1.mp3"
            },
            {
              "visual": "Meiocytes: Specialised diploid cells that undergo meiosis.",
              "narration_fragment": "In diploid organisms, there are specialized cells called meiocytes, or gamete mother cells. These are the cells that undergo meiosis to form the gametes.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_018_seg_2.mp3"
            },
            {
              "visual": "Example: Humans have 46 chromosomes in meiocytes, but 23 in gametes.",
              "narration_fragment": "For example, in human beings, our body cells are diploid with 46 chromosomes. But our gametes, sperm and egg, are haploid with only 23 chromosomes.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_018_seg_3.mp3"
            }
          ],

        {
          "slide_number": 19,
          "slide_type": "content",
          "title": "Pre-Fertilisation Event 2: Gamete Transfer",
          "image_id": null,
          "segments": [
            {
              "visual": "Bringing male and female gametes together for fertilisation.",
              "narration_fragment": "After gametes are formed, the next critical step is bringing them together. This process is called gamete transfer. It is a prerequisite for fusion.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_019_seg_0.mp3"
            },
            {
              "visual": "In most organisms, male gamete is motile, female is stationary.",
              "narration_fragment": "In the majority of cases, the male gamete is motile and has to travel to the stationary female gamete. This often requires a medium, like water in algae and bryophytes.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_019_seg_1.mp3"
            },
            {
              "visual": "Pollination: Transfer of pollen grains (carrying male gametes) to the stigma in plants.",
              "narration_fragment": "In seed plants, this transfer is achieved by a specialized event called pollination. Pollen grains, which carry the male gametes, are transferred from the anther to the stigma.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_019_seg_2.mp3"
            },
            {
              "visual": "Pollen tube grows to deliver male gametes to the ovule.",
              "narration_fragment": "After landing on the stigma, the pollen grain germinates, growing a pollen tube. This tube acts as a delivery pipe, carrying the male gametes down to the ovule to reach the egg.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_019_seg_3.mp3"
            }

        {
          "slide_number": 20,
          "slide_type": "content",
          "title": "The Main Event: Fertilisation (Syngamy)",
          "image_id": null,
          "segments": [
            {
              "visual": "Syngamy: The fusion of male and female gametes.",
              "narration_fragment": "The most vital event of sexual reproduction is the fusion of gametes. This process is called syngamy, and the term fertilisation is also commonly used.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_020_seg_0.mp3"
            },
            {
              "visual": "Results in the formation of a diploid (2n) Zygote.",
              "narration_fragment": "The fusion of two haploid gametes restores the diploid condition, resulting in the formation of a single diploid cell called the zygote. This is the first cell of the new individual.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_020_seg_1.mp3"
            },
            {
              "visual": "External Fertilisation: Fusion occurs outside the body (e.g., in water).",
              "narration_fragment": "In most aquatic organisms like fish and amphibians, syngamy occurs in the external medium, usually water. This is called external fertilisation.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_020_seg_2.mp3"
            },
            {
              "visual": "Internal Fertilisation: Fusion occurs inside the female body.",
              "narration_fragment": "In most terrestrial organisms, including reptiles, birds, mammals, and higher plants, syngamy occurs inside the body of the female organism. This is called internal fertilisation.",
              "duration_estimate": 11,
              "audio_file": "audio/slide_020_seg_3.mp3"
            },
            {
              "visual": "Parthenogenesis: Development without fertilisation (e.g., Honeybees, some lizards).",
              "narration_fragment": "Interestingly, in some organisms like honeybees and certain lizards, the female gamete can develop into a new organism without any fertilisation. This phenomenon is called parthenogenesis.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_020_seg_4.mp3"
            }
          ],

        {
          "slide_number": 21,
          "slide_type": "content",
          "title": "Post-Fertilisation Event 1: The Zygote",
          "image_id": null,
          "segments": [
            {
              "visual": "The first cell of the new generation.",
              "narration_fragment": "The zygote is the vital link that ensures continuity of species between organisms of one generation and the next. Every sexually reproducing organism begins its life as a single cell, the zygote.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_021_seg_0.mp3"
            },
            {
              "visual": "In fungi & algae, it develops a thick wall for protection.",
              "narration_fragment": "In organisms like fungi and algae, the zygote often develops a thick, resistant wall. This protects it from drying out and other damage, allowing it to rest until conditions are favorable.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_021_seg_1.mp3"
            },
            {
              "visual": "Haplontic life cycle: Zygote (2n) divides by meiosis to form haploid (n) spores.",
              "narration_fragment": "In organisms with a haplontic life cycle, the diploid zygote is the only diploid stage. It quickly undergoes meiosis to form haploid spores which grow into the main plant body.",
              "duration_estimate": 12,
              "audio_file": "audio/slide_021_seg_2.mp3"
            },
            {
              "visual": "Diplontic life cycle: Zygote (2n) divides by mitosis to form an embryo (2n).",
              "narration_fragment": "In organisms with a diplontic life cycle, like humans, the diploid zygote divides by mitosis. It develops into a multicellular diploid embryo.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_021_seg_3.mp3"
            }
          ],

        {
          "slide_number": 22,
          "slide_type": "content",
          "title": "Post-Fertilisation Event 2: Embryogenesis",
          "image_id": null,
          "segments": [
            {
              "visual": "Embryogenesis: Development of the embryo from the zygote.",
              "narration_fragment": "Embryogenesis is the process of development of an embryo from the zygote. It involves two key cellular processes: cell division and cell differentiation.",
              "duration_estimate": 10,
              "audio_file": "audio/slide_022_seg_0.mp3"
            },
            {
              "visual": "Cell Division (Mitosis): Increases the number of cells.",
              "narration_fragment": "The zygote undergoes repeated mitotic divisions, increasing the number of cells in the developing embryo from one, to two, to four, and so on.",
              "duration_estimate": 9,
              "audio_file": "audio/slide_022_seg_1.mp3"
            },
            {
              "visual": "Cell Differentiation: Cells form specialized tissues and organs.",
              "narration_fragment": "Cell differentiation is the process where groups of cells undergo modifications. They become specialized to form different tissues and organs, like muscle tissue, nerve tissue, and so on, to form a complete organism.",
              "duration_estimate": 13,
              "audio_file": "audio/slide_022_seg_2.mp3"
            },
            {
